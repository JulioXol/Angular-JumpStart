name: SonarQube Cloud Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: Build, Test y Análisis SonarQube Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout completo del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Compilar el proyecto (Angular)
        run: npm run build

      - name: Pruebas
        run: npm test -- --watch=false --browsers=ChromeHeadless || echo "El proyecto no tiene pruebas unitarias configuradas"

      - name: Análisis con SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
